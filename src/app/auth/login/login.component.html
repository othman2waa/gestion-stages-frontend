<div class="login-container">
  <mat-card class="login-card">

    <!-- Logo & Titre -->
    <mat-card-header>
      <div class="login-header">
        <div class="logo">
          <span class="logo-text">OCP</span>
        </div>
        <h1>Gestion des Stages</h1>
        <p>Connectez-vous à votre espace</p>
      </div>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- Username -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nom d'utilisateur</mat-label>
          <input matInput formControlName="username" placeholder="ex: admin.rh">
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            Le nom d'utilisateur est requis
          </mat-error>
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'"
                 formControlName="password">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button"
                  (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Le mot de passe est requis
          </mat-error>
        </mat-form-field>

        <!-- Remember me -->
        <div class="remember-row">
          <mat-checkbox [(ngModel)]="rememberMe" [ngModelOptions]="{standalone: true}">
            Se souvenir de moi
          </mat-checkbox>
        </div>

        <!-- Error Message -->
        <div class="error-message" *ngIf="errorMessage">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Submit Button -->
        <button mat-raised-button color="primary" type="submit"
                class="full-width login-btn"
                [disabled]="loginForm.invalid || isLoading">
          <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
          <span *ngIf="!isLoading">Se connecter</span>
        </button>

      </form>

      <!-- Demo Accounts -->
      <div class="demo-hint">
        <div class="demo-title">
          <mat-icon>science</mat-icon>
          <span>Comptes de démonstration</span>
        </div>
        <div class="demo-accounts">
          <button *ngFor="let acc of demoAccounts" class="demo-chip" (click)="fillDemo(acc)">
            <mat-icon>{{ acc.icon }}</mat-icon>
            <span>{{ acc.label }}</span>
          </button>
        </div>
      </div>
    </mat-card-content>

  </mat-card>
</div>
