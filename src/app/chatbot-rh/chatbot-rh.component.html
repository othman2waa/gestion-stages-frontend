<div class="cbrh">

  <div class="cbrh-header">
    <div class="cbrh-icon"><mat-icon>smart_toy</mat-icon></div>
    <div>
      <h3>Assistant RH IA</h3>
      <p>Posez une question sur l'activité (candidatures, stages, conformité) ou demandez un résumé.</p>
    </div>
  </div>

  <div class="cbrh-input">
    <input [(ngModel)]="question" type="text"
      placeholder="Ex : combien de candidatures en attente ? Résume la situation."
      (keydown.enter)="envoyer()">
    <button mat-flat-button class="cbrh-send" [disabled]="loading || !question.trim()" (click)="envoyer()">
      <mat-icon>send</mat-icon>
    </button>
  </div>

  <div class="cbrh-examples" *ngIf="!reponse && !loading">
    <button class="ex-chip" *ngFor="let e of exemples" (click)="utiliser(e)">{{ e }}</button>
  </div>

  <div *ngIf="loading" class="cbrh-loading">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    <p><mat-icon>smart_toy</mat-icon> L'assistant analyse les données…</p>
  </div>

  <div *ngIf="error" class="cbrh-error"><mat-icon>error_outline</mat-icon> {{ error }}</div>

  <div *ngIf="reponse && !loading" class="cbrh-result">
    <div class="cbrh-kpis">
      <div class="kpi" *ngFor="let k of kpis">
        <span class="kpi-val">{{ k.value }}</span>
        <span class="kpi-lbl">{{ k.label }}</span>
      </div>
    </div>
    <div class="cbrh-answer">
      <mat-icon>smart_toy</mat-icon>
      <p>{{ reponse.message }}</p>
    </div>
  </div>

</div>
