<mat-toolbar class="navbar" [class.collapsed]="isCollapsed">
  <button mat-icon-button (click)="toggleSidebar.emit()">
    <mat-icon>{{ isCollapsed ? 'menu_open' : 'menu' }}</mat-icon>
  </button>

  <!-- Breadcrumb -->
  <div class="breadcrumb" *ngIf="breadcrumb">
    <mat-icon class="bc-icon">{{ breadcrumb.icon }}</mat-icon>
    <span class="bc-label">{{ breadcrumb.label }}</span>
  </div>
  <span class="page-title" *ngIf="!breadcrumb">OCP — Gestion des Stages</span>

  <span class="spacer"></span>

  <div class="user-info" *ngIf="authService.getCurrentUser() as user">
    <mat-icon>account_circle</mat-icon>
    <div class="user-details">
      <span class="username">{{ user.username }}</span>
      <span class="role">{{ user.role }}</span>
    </div>
  </div>
</mat-toolbar>
